name: Prompter
options:
  bundleIdPrefix: com.devesh
  deploymentTarget:
    macOS: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.3.0
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Prompter:
    type: application
    platform: macOS
    sources: [Prompter]
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Prompter/Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devesh.prompter
        # Not sandboxed: the App Sandbox blocks the Accessibility and synthetic-keystroke APIs Prompter needs.
        CODE_SIGN_IDENTITY: "0BFBFD84E73C2F59834B8EA4EFB57AF52E7D19A1" # stable Apple Development cert so the Accessibility grant survives rebuilds
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Notarization needs it; in Debug it would block loading the separately signed test bundle.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  PrompterTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PrompterTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Prompter
